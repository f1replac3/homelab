networks:
  pihole_dns_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

services:
  unbound:
    container_name: unbound
    image: mvance/unbound:latest
    restart: unless-stopped
    networks:
      pihole_dns_network:
        ipv4_address: 172.21.0.2
    volumes:
      - ./volumes/unbound:/opt/unbound/etc/unbound
    tmpfs:
      - /var/run/unbound
    ports:
      - "5335:5335/tcp"
      - "5335:5335/udp"

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole
    depends_on:
      - unbound
    restart: unless-stopped
    networks:
      pihole_dns_network:
        ipv4_address: 172.21.0.3
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: "America/Denver"
      WEBPASSWORD: "rootpi"
      PIHOLE_DNS_: 172.21.0.2#5335
      DNSMASQ_LISTENING: all
      DNSSEC: true
    volumes:
      - ./volumes/etc-pihole:/etc/pihole
      - ./volumes/etc-dnsmasq.d:/etc/dnsmasq.d

  portainer-agent:
    image: portainer/agent:latest
    container_name: portainer-agent
    restart: unless-stopped
    ports:
      - "9010:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      pihole_dns_network:
        ipv4_address: 172.21.0.4
