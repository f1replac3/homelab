serversTransports:
  proxmox-insecure:
    insecureSkipVerify: true
tls:
  certificates:
    - certFile: /root/certs/fullchain.pem
      keyFile: /root/certs/privkey.pem
http:
  middlewares:
    secured-headers:
      headers:
        sslRedirect: true
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true

  routers:
    proxmox:
      rule: "Host(`proxmox.max.lab`)"
      entryPoints:
        - websecure
      service: proxmox-svc
      tls: {}
      middlewares:
        - secured-headers

    pihole:
      rule: "Host(`pihole.max.lab`)"
      entryPoints:
        - websecure
      service: pihole-svc
      tls: {}
      middlewares:
        - secured-headers

    grafana:
      rule: "Host(`grafana.max.lab`)"
      entryPoints:
        - websecure
      service: grafana-svc
      tls: {}
      middlewares:
        - secured-headers

    prometheus:
      rule: "Host(`prometheus.max.lab`)"
      entryPoints:
        - websecure
      service: prometheus-svc
      tls: {}
      middlewares:
        - secured-headers

    glances:
      rule: "Host(`glances.max.lab`)"
      entryPoints:
        - websecure
      service: glances-svc
      tls: {}
      middlewares:
        - secured-headers

    cadvisor:
      rule: "Host(`cadvisor.max.lab`)"
      entryPoints:
        - websecure
      service: cadvisor-svc
      tls: {}
      middlewares:
        - secured-headers

    traefik-dashboard:
      rule: "Host(`traefik.max.lab`)"
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
      middlewares:
        - secured-headers

    portainer:
      rule: "Host(`portainer.max.lab`)"
      entryPoints:
        - websecure
      service: portainer-svc
      tls: {}
      middlewares:
        - secured-headers


  services:
    pihole-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.7"

    grafana-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.5:3000"

    prometheus-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.5:9090"

    glances-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.5:61208"

    cadvisor-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.5:8080"
    
    portainer-svc:
      loadBalancer:
        servers:
          - url: "http://10.0.10.8:9000"

    proxmox-svc:
      loadBalancer:
        servers:
          - url: "https://10.0.10.10:8006"
        passHostHeader: true
        serversTransport: proxmox-insecure
